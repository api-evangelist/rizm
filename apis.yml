name: Rizm
description: RIZM is a holistic energy optimization platform for industrial enterprises,
  operated by Kerith GmbH of Münster, Germany. It integrates data from production,
  energy procurement, and infrastructure into a digital twin, then optimizes energy
  system design and day-to-day operational decisions — from long-term infrastructure
  investment and power purchase agreements to short-term asset dispatch and production
  scheduling — helping manufacturers cut energy costs and emissions at the same time.
  Named customers include BMW Group, Bosch, Mercedes-Benz, Volkswagen, and BSH. The
  product is delivered as a login-gated web application (app.rizm.de) with authenticated
  documentation; no public developer API, OpenAPI, or SDK surface is published at this
  time. Backed by Point Nine, this profile was surfaced from the venture portfolio graph.
